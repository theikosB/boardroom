<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Boardroom is a private place to play board games with friends in the browser."
    />
    <title>Boardroom</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("boardroom-theme");
          var choice = stored === "light" || stored === "dark" ? stored : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = choice === "dark" || (choice === "system" && systemDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          var fallbackDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", fallbackDark);
          document.documentElement.style.colorScheme = fallbackDark ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
